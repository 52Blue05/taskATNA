version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sale-saas-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: ${LOCAL_DB_MAIN}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sale-saas-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sale-saas-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sale-saas-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  sale-saas-network:
    driver: bridge
