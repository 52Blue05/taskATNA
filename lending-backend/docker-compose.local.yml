version: "2.40.3"

services:
  db:
    image: mysql:8.0.43
    container_name: lending_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: lending
      MYSQL_USER: lending
      MYSQL_PASSWORD: lending
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

  backend:
    build: .
    container_name: lending_backend
    command: go run cmd/api/main.go
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  db_data:
